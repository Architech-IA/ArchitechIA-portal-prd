# =============================================================================
# EAIH - Executive AI Inbox & Hub — Staging Environment
# =============================================================================
# Uso: docker compose -f docker-compose.staging.yml up -d
# Propósito: Réplica de producción para QA, demos y validación
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — Base de datos de staging
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: eaih-postgres-staging
    restart: unless-stopped
    environment:
      POSTGRES_USER: eaih_staging
      POSTGRES_PASSWORD: "${DB_STAGING_PASSWORD:?Set DB_STAGING_PASSWORD in .env.staging}"
      POSTGRES_DB: eaih_staging
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "5434:5432"
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - eaih-internal-staging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eaih_staging -d eaih_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # ---------------------------------------------------------------------------
  # Redis 7 — Cache y sesiones de staging
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: eaih-redis-staging
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_STAGING_PASSWORD:?Set REDIS_STAGING_PASSWORD in .env.staging}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    ports:
      - "6381:6379"
    volumes:
      - redis_staging_data:/data
    networks:
      - eaih-internal-staging
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_STAGING_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ---------------------------------------------------------------------------
  # App Next.js — Staging (build optimizado)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: ../../..
      dockerfile: src/eaih/infra/Dockerfile
      target: runner
    container_name: eaih-app-staging
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3011"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: "postgresql://eaih_staging:${DB_STAGING_PASSWORD}@postgres:5432/eaih_staging?schema=public&pgbouncer=true"
      DIRECT_URL: "postgresql://eaih_staging:${DB_STAGING_PASSWORD}@postgres:5432/eaih_staging?schema=public"
      REDIS_URL: "redis://:${REDIS_STAGING_PASSWORD}@redis:6379"
      NEXTAUTH_SECRET: "${NEXTAUTH_STAGING_SECRET:?Set NEXTAUTH_STAGING_SECRET}"
      NEXTAUTH_URL: "https://eaih-staging.architechia.co"
      # Google OAuth
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      # Microsoft OAuth
      MS_CLIENT_ID: "${MS_CLIENT_ID:-}"
      MS_CLIENT_SECRET: "${MS_CLIENT_SECRET:-}"
      MS_TENANT_ID: "${MS_TENANT_ID:-common}"
      # AI / LLM
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      # Logging
      LOG_LEVEL: info
      # EAIH flags
      EAIH_ENV: staging
      EAIH_LOG_ENCRYPTED_FIELDS: "false"
      EAIH_DATA_RETENTION_DAYS: "90"
      # Privacidad
      EAIH_PII_MASKING: "true"
    ports:
      - "3011:3011"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eaih-internal-staging
      - eaih-external-staging
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"

  # ---------------------------------------------------------------------------
  # Nginx — Reverse proxy + SSL termination para staging
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: eaih-nginx-staging
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/staging.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_staging_logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - eaih-external-staging

  # ---------------------------------------------------------------------------
  # Prometheus — Métricas de monitoreo (staging)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: eaih-prometheus-staging
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/staging.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_staging_data:/prometheus
    networks:
      - eaih-internal-staging
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_staging_data:
    driver: local
  redis_staging_data:
    driver: local
  nginx_staging_logs:
    driver: local
  prometheus_staging_data:
    driver: local

networks:
  eaih-internal-staging:
    driver: bridge
    name: eaih-internal-staging
  eaih-external-staging:
    driver: bridge
    name: eaih-external-staging
