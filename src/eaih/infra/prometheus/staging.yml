# =============================================================================
# EAIH — Prometheus Configuration (Staging)
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "eaih-app-staging"
    static_configs:
      - targets: ["app:3011"]
    metrics_path: "/api/metrics"
    scrape_interval: 30s

  - job_name: "eaih-redis-staging"
    static_configs:
      - targets: ["redis:6379"]

  - job_name: "eaih-postgres-staging"
    static_configs:
      - targets: ["postgres:5432"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
