# =============================================================================
# EAIH - Executive AI Inbox & Hub — Development Environment
# =============================================================================
# Uso: docker compose -f docker-compose.dev.yml up -d
# Requiere: Docker >= 24.0, Docker Compose v2
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — Base de datos de desarrollo
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: eaih-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: eaih_dev
      POSTGRES_PASSWORD: eaih_dev_secret_2026
      POSTGRES_DB: eaih_dev
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "5433:5432"  # 5433 para evitar conflicto con PostgreSQL del host
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - eaih-internal-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eaih_dev -d eaih_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis 7 — Cache, sesiones, queue de tareas
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: eaih-redis-dev
    restart: unless-stopped
    command: >
      redis-server
      --requirepass eaih_redis_dev_2026
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "6380:6379"  # 6380 para evitar conflicto con Redis del host
    volumes:
      - redis_dev_data:/data
    networks:
      - eaih-internal-dev
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "eaih_redis_dev_2026", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # App Next.js — Desarrollo con hot-reload
  # ---------------------------------------------------------------------------
  app:
    build:
      context: ../../..
      dockerfile: src/eaih/infra/Dockerfile.dev
    container_name: eaih-app-dev
    restart: unless-stopped
    volumes:
      - ../../..:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      PORT: "3010"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: "postgresql://eaih_dev:eaih_dev_secret_2026@postgres:5432/eaih_dev?schema=public"
      DIRECT_URL: "postgresql://eaih_dev:eaih_dev_secret_2026@postgres:5432/eaih_dev?schema=public"
      REDIS_URL: "redis://:eaih_redis_dev_2026@redis:6379"
      NEXTAUTH_SECRET: "eaih-dev-secret-change-in-prod-2026"
      NEXTAUTH_URL: "http://localhost:3010"
      # Google OAuth (placeholders — completar en .env.local)
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      # Microsoft OAuth (placeholders)
      MS_CLIENT_ID: "${MS_CLIENT_ID:-}"
      MS_CLIENT_SECRET: "${MS_CLIENT_SECRET:-}"
      MS_TENANT_ID: "${MS_TENANT_ID:-common}"
      # AI / LLM
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      # Logging
      LOG_LEVEL: debug
      # EAIH flags
      EAIH_ENV: development
      EAIH_LOG_ENCRYPTED_FIELDS: "false"
    ports:
      - "3010:3010"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eaih-internal-dev
      - eaih-external-dev

  # ---------------------------------------------------------------------------
  # pgAdmin — UI de administración de PostgreSQL (dev)
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: eaih-pgadmin-dev
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@architechia.co
      PGADMIN_DEFAULT_PASSWORD: eaih_pgadmin_2026
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_dev_data:/var/lib/pgadmin
    networks:
      - eaih-internal-dev
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  pgadmin_dev_data:
    driver: local

networks:
  eaih-internal-dev:
    driver: bridge
    name: eaih-internal-dev
  eaih-external-dev:
    driver: bridge
    name: eaih-external-dev
